---
# Host and token facts consumed by tasks/publish_credential.yml.
# AWS leaves gitea_api_host unset and falls through to the EC2 public IP.
# OpenShift sets gitea_api_host to the route hostname and gitea_api_port to 443.
- name: Persist CI/CD token facts for Controller publish
  vars:
    gitea_credential_host_value: >-
      {{
        gitea_api_host
        if ((gitea_api_host | default('') | length) > 0)
        else gitea_public_ip
      }}
    gitea_credential_port_value: >-
      {{
        gitea_api_port
        if ((gitea_api_port | default('') | string | length) > 0)
        else gitea_http_port
      }}
  ansible.builtin.set_fact:
    gitea_credential_host: "{{ gitea_credential_host_value }}"
    gitea_credential_port: "{{ gitea_credential_port_value | string }}"
    gitea_credential_token: "{{ gitea_api_token }}"
    gitea_credential_owner: "{{ gitea_repo_owner }}"
    gitea_credential_repo: "{{ gitea_repo_name }}"
    gitea_credential_source: >-
      {{ gitea_credential_source | default('Infrastructure | AWS - Provision Gitea') }}
  delegate_to: localhost
  delegate_facts: true
  no_log: true
