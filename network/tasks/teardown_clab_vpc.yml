---
- name: Find EC2 instances in clab VPC
  amazon.aws.ec2_instance_info:
    region: "{{ clab_aws_region }}"
    filters:
      vpc-id: "{{ clab_vpc_id }}"
      instance-state-name:
        - pending
        - running
        - shutting-down
        - stopping
        - stopped
  register: clab_vpc_instances

- name: Terminate EC2 instances in clab VPC
  amazon.aws.ec2_instance:
    state: absent
    instance_ids: "{{ clab_vpc_instances.instances | map(attribute='instance_id') | list }}"
    region: "{{ clab_aws_region }}"
    wait: true
  when: clab_vpc_instances.instances | length > 0

- name: Find network interfaces in clab VPC
  amazon.aws.ec2_eni_info:
    region: "{{ clab_aws_region }}"
    filters:
      vpc-id: "{{ clab_vpc_id }}"
  register: clab_vpc_enis

- name: Delete network interfaces in clab VPC
  amazon.aws.ec2_eni:
    state: absent
    eni_id: "{{ clab_eni.id }}"
    region: "{{ clab_aws_region }}"
  loop: "{{ clab_vpc_enis.network_interfaces | default([]) }}"
  loop_control:
    loop_var: clab_eni
    label: "{{ clab_eni.id }}"
  failed_when: false

- name: Find internet gateways attached to clab VPC
  amazon.aws.ec2_vpc_igw_info:
    region: "{{ clab_aws_region }}"
    filters:
      attachment.vpc-id: "{{ clab_vpc_id }}"
  register: clab_vpc_igws

- name: Delete internet gateways attached to clab VPC
  amazon.aws.ec2_vpc_igw:
    state: absent
    internet_gateway_id: "{{ clab_igw.internet_gateway_id }}"
    region: "{{ clab_aws_region }}"
  loop: "{{ clab_vpc_igws.internet_gateways | default([]) }}"
  loop_control:
    loop_var: clab_igw
    label: "{{ clab_igw.internet_gateway_id }}"

- name: Find all subnets in clab VPC
  amazon.aws.ec2_vpc_subnet_info:
    region: "{{ clab_aws_region }}"
    filters:
      vpc-id: "{{ clab_vpc_id }}"
  register: clab_vpc_subnets

- name: Delete all subnets in clab VPC
  amazon.aws.ec2_vpc_subnet:
    state: absent
    vpc_id: "{{ clab_vpc_id }}"
    cidr: "{{ clab_subnet.cidr_block }}"
    region: "{{ clab_aws_region }}"
  loop: "{{ clab_vpc_subnets.subnets | default([]) }}"
  loop_control:
    loop_var: clab_subnet
    label: "{{ clab_subnet.tags.Name | default(clab_subnet.subnet_id) }}"

- name: Find route tables in clab VPC
  amazon.aws.ec2_vpc_route_table_info:
    region: "{{ clab_aws_region }}"
    filters:
      vpc-id: "{{ clab_vpc_id }}"
  register: clab_route_tables

- name: Delete custom route tables in clab VPC
  amazon.aws.ec2_vpc_route_table:
    state: absent
    lookup: id
    vpc_id: "{{ clab_vpc_id }}"
    route_table_id: "{{ clab_route_table.id }}"
    region: "{{ clab_aws_region }}"
  when: clab_route_table.associations | default([]) | selectattr('main', 'equalto', true) | list | length == 0
  loop: "{{ clab_route_tables.route_tables | default([]) }}"
  loop_control:
    loop_var: clab_route_table
    label: "{{ clab_route_table.tags.Name | default(clab_route_table.id) }}"
  failed_when: false

- name: Find security groups in clab VPC
  amazon.aws.ec2_security_group_info:
    region: "{{ clab_aws_region }}"
    filters:
      vpc-id: "{{ clab_vpc_id }}"
  register: clab_vpc_security_groups

- name: Delete non-default security groups in clab VPC
  amazon.aws.ec2_security_group:
    state: absent
    group_id: "{{ clab_security_group.group_id }}"
    region: "{{ clab_aws_region }}"
  loop: >-
    {{ clab_vpc_security_groups.security_groups | default([])
       | rejectattr('group_name', 'equalto', 'default') | list }}
  loop_control:
    loop_var: clab_security_group
    label: "{{ clab_security_group.group_name }}"
  failed_when: false

- name: Delete clab VPC
  amazon.aws.ec2_vpc_net:
    state: absent
    vpc_id: "{{ clab_vpc_id }}"
    region: "{{ clab_aws_region }}"
